# CI para proyectos Node/TypeScript. Marca este workflow como "required status check" en
# Settings → Branches → main. Ajusta los scripts si tu package.json usa otros nombres.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos y tests (${{ matrix.paquete }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paquete: [core, api, web]
    defaults:
      run:
        working-directory: ${{ matrix.paquete }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ${{ matrix.paquete }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run --if-present lint
      - name: Tipos
        run: pnpm run --if-present typecheck
      - name: Tests
        run: pnpm run --if-present test
      - name: Dependencias con vulnerabilidades conocidas
        run: pnpm audit --audit-level=high --prod

  trazabilidad:
    name: Cada criterio de aceptación tiene su test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          python3 scripts/trazabilidad.py --check --escribir
          git diff --exit-code docs/trazabilidad.md || { echo "docs/trazabilidad.md está desactualizado: corre python3 scripts/trazabilidad.py --escribir y commitea"; exit 1; }

  secretos:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Código vulnerable (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - run: semgrep scan --config p/typescript --config p/javascript --config p/secrets --config p/owasp-top-ten --error

  dependencias:
    name: Dependencias (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
