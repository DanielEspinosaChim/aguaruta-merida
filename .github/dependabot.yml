# .github/dependabot.yml — hoy existe en 1 de 53 repos.
# Abre PRs; nunca rompe el build.
version: 2
updates:
  - package-ecosystem: npm
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-menores:
        dependency-type: development
        update-types: [minor, patch]
      prod-parches:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-menores:
        dependency-type: development
        update-types: [minor, patch]
      prod-parches:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-menores:
        dependency-type: development
        update-types: [minor, patch]
      prod-parches:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-menores:
        dependency-type: development
        update-types: [minor, patch]
      prod-parches:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
